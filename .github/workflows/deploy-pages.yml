name: Deploy V24.5 Client to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Network identity is fixed in src/config.js for Bohr Testnet (968). Keep only
  # deployment-specific values here so stale legacy Base variables cannot confuse setup.
  VITE_CONTRACT_ADDRESS: ${{ vars.VITE_CONTRACT_ADDRESS }}
  VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
  VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate WalletConnect configuration
        shell: bash
        run: |
          if [ -z "${VITE_WALLETCONNECT_PROJECT_ID}" ]; then
            echo "::error::VITE_WALLETCONNECT_PROJECT_ID is required for real WalletConnect QR/mobile pairing. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Validate contract address format
        shell: bash
        run: |
          if [ -n "${VITE_CONTRACT_ADDRESS}" ]; then
            if [[ ! "${VITE_CONTRACT_ADDRESS}" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "::error::VITE_CONTRACT_ADDRESS must be a 20-byte EVM address (0x + 40 hex characters)."
              exit 1
            fi
            if [[ "${VITE_CONTRACT_ADDRESS,,}" == "0x0000000000000000000000000000000000000000" ]]; then
              echo "::error::VITE_CONTRACT_ADDRESS cannot be the zero address."
              exit 1
            fi
          fi

      - name: Static validation
        run: npm run check

      - name: Compile V23 contract
        run: npm run compile

      - name: Run V23 contract tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
