name: V24.5 Build and Security Test

on: push: branches: [ main, master ] pull_request: workflow_dispatch:

jobs: audit-build: runs-on: ubuntu-latest steps: - name: Checkout uses:
actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static project and syntax checks
        run: set -o pipefail; npm run check 2>&1 | tee v23-static-audit.txt

      - name: Compile smart contract
        run: set -o pipefail; npm run compile 2>&1 | tee v23-contract-compile.txt

      - name: Run smart-contract security tests
        run: set -o pipefail; npm test 2>&1 | tee v23-contract-tests.txt

      - name: Build frontend
        run: set -o pipefail; npm run build 2>&1 | tee v23-frontend-build.txt

      - name: Check build output
        run: test -f dist/index.html

      - name: Preserve CI audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-ci-audit-${{ github.run_number }}
          path: |
            v23-static-audit.txt
            v23-contract-compile.txt
            v23-contract-tests.txt
            v23-frontend-build.txt
          if-no-files-found: warn
          retention-days: 30
